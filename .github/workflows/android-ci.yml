name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
      - '.github/actions/setup-android/**'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-*.yml'
      - '.github/actions/setup-android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Build APK, run JVM tests and Android lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: KNITUshka-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
