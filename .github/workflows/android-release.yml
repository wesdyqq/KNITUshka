name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          # A manual retry uses the updated workflow but builds the immutable version tag.
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate tag and required signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected a version tag such as v1.0.0 or v1.1.0-beta.1' >&2
            exit 1
          fi
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing signing secret for $name. See docs/releases.md. No release will be published." >&2
              exit 1
            fi
          done
      - uses: ./.github/actions/setup-android
      - name: Download emulator packages with bounded retries
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing emulator dependencies (attempt $attempt/3)"
            if sdkmanager --install emulator platform-tools 'build-tools;37.0.0' \
              'platforms;android-35' 'system-images;android-35;google_apis;x86_64'; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo 'SDK download failed after three attempts. No release will be published.' >&2
              exit 1
            fi
          done
      - name: Restore private signing key outside the repository
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/knitushka-release.jks"
      - name: Test and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/knitushka-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PandroidVersionName="${RELEASE_TAG#v}" --no-daemon --no-configuration-cache --console=plain
      - name: Verify APK signature and prepare download
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/KNITUshka-${RELEASE_TAG}.apk"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "KNITUshka-${RELEASE_TAG}.apk" > "KNITUshka-${RELEASE_TAG}.apk.sha256"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test the signed release APK before publication
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-startup-smoke.sh" "$GITHUB_WORKSPACE/dist/KNITUshka-${RELEASE_TAG}.apk"
      - name: Publish GitHub Release after successful verification and startup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/dist/KNITUshka-${RELEASE_TAG}.apk" \
            "$GITHUB_WORKSPACE/dist/KNITUshka-${RELEASE_TAG}.apk.sha256" \
            --verify-tag --generate-notes --title "КНИТУшка ${RELEASE_TAG}" "${flags[@]}"
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/knitushka-release.jks"
